<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Reporting Tool</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .bg-grid { background-image: linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px); background-size: 32px 32px; }
    .sidebar-link.active { background: rgba(6, 182, 212, 0.15); border-color: rgba(6, 182, 212, 0.4); color: rgb(34, 211, 238); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 bg-grid flex flex-col overflow-hidden">
  <!-- Global horizontal header: fixed at top, never scrolls -->
  <header class="shrink-0 sticky top-0 z-20 flex items-center justify-center px-6 h-16 border-b border-cyan-400/50 bg-gradient-to-r from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/20">
    <div class="flex items-center gap-3">
      <!-- Logo: clipboard with check (QA / reporting) -->
      <span class="flex items-center justify-center w-10 h-10 rounded-xl bg-white/20 border border-white/30 text-white shrink-0" aria-hidden="true">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2" />
          <path d="M15 2H9a1 1 0 00-1 1v2h8V3a1 1 0 00-1-1z" />
          <path d="M9 14l2 2 4-4" />
        </svg>
      </span>
      <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">QA Reporting Tool</h1>
    </div>
  </header>

  <!-- Below header: sidebar + main -->
  <div class="flex flex-1 min-h-0 min-w-0">
  <!-- Left sidebar: collapsible -->
  <aside id="sidebar" class="flex flex-col border-r border-slate-700/80 bg-slate-900/50 transition-[width] duration-200 ease-out overflow-hidden flex-shrink-0" style="width: var(--sidebar-width, 14rem);">
    <div class="shrink-0 flex items-center justify-end p-3 border-b border-slate-700/80 min-w-0">
      <button type="button" id="sidebar-close" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/60 transition-colors" aria-label="Close sidebar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
      </button>
    </div>
    <nav class="p-3 flex-1 space-y-1 min-w-0">
      <div class="space-y-0.5">
        <a href="{{ url_for('qa_daily_report') }}" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition-colors {% if active_page == 'qa_daily_report' %}active{% endif %}">
          <svg class="w-5 h-5 shrink-0 text-cyan-400/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
          <span class="sidebar-label truncate">QA Daily Report</span>
        </a>
        <a href="{{ url_for('scheduler_logs') }}" class="sidebar-link flex items-center gap-3 pl-6 pr-3 py-2 rounded-lg text-xs font-medium text-slate-500 hover:text-slate-300 hover:bg-slate-800/60 border border-transparent transition-colors {% if active_page == 'scheduler_logs' %}active{% endif %}">
          <svg class="w-4 h-4 shrink-0 text-cyan-400/70" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
          <span class="sidebar-label truncate">Scheduler Logs</span>
        </a>
      </div>
      <a href="{{ url_for('qa_project_challenges') }}" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition-colors {% if active_page == 'qa_project_challenges' %}active{% endif %}">
        <svg class="w-5 h-5 shrink-0 text-violet-400/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
        <span class="sidebar-label truncate">QA Project Challenges</span>
      </a>
    </nav>
  </aside>

  <!-- Toggle to open sidebar when closed: in its own strip so it never overlaps page content -->
  <div id="sidebar-open-strip" class="hidden shrink-0 w-12 flex flex-col items-center border-r border-slate-700/80 bg-slate-800/60 py-2">
    <button type="button" id="sidebar-open" class="p-2.5 rounded-lg text-slate-400 hover:text-cyan-400 hover:bg-slate-700/60 transition-colors" aria-label="Open sidebar">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg>
    </button>
  </div>

  <!-- Main content: page headers and content; this area scrolls -->
  <main id="main-content" class="flex-1 flex flex-col min-h-0 min-w-0 overflow-auto">
    {% block content %}{% endblock %}
  </main>
  </div>

  <script>
  (function() {
    var sidebar = document.getElementById('sidebar');
    var openStrip = document.getElementById('sidebar-open-strip');
    var openBtn = document.getElementById('sidebar-open');
    var closeBtn = document.getElementById('sidebar-close');
    var main = document.getElementById('main-content');
    var storageKey = 'qa-reporting-sidebar-open';
    function setOpen(open) {
      sidebar.setAttribute('data-open', open ? 'true' : 'false');
      sidebar.style.setProperty('--sidebar-width', open ? '14rem' : '0');
      if (openStrip) openStrip.classList.toggle('hidden', open);
      if (main) main.classList.toggle('sidebar-closed', !open);
      try { localStorage.setItem(storageKey, open ? '1' : '0'); } catch (e) {}
    }
    if (openBtn) openBtn.addEventListener('click', function() { setOpen(true); });
    if (closeBtn) closeBtn.addEventListener('click', function() { setOpen(false); });
    var saved = null;
    try { saved = localStorage.getItem(storageKey); } catch (e) {}
    setOpen(saved !== '0');
  })();
  </script>
</body>
</html>
